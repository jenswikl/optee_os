name: Trigger Full CI
on:
  issue_comment:
    types: [created]

jobs:
  check_comment:
    name: Parse Comment Command
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/test all')
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
      head_sha: ${{ steps.fetch.outputs.head_sha }}
    steps:
      - name: Verify permissions
        id: auth
        # Ensure only PR authors or collaborators can trigger it
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const commentUser = context.payload.comment.user.login;
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.payload.issue.number
            });
            const author = pr.data.user.login;
            
            // Allow PR author or check if user has write/admin permissions
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: commentUser
            });
            const isAdminOrWrite = ['admin', 'write'].includes(permission.data.permission);

            if (commentUser === author || isAdminOrWrite) {
              core.setOutput('authorized', 'true');
              core.setOutput('head_sha', pr.data.head.sha);
            } else {
              core.setOutput('authorized', 'false');
            }

  run_full_matrix:
    needs: check_comment
    if: needs.check_comment.outputs.authorized == 'true'
    # Insert your heavy 'builds' and 'QEMU' jobs matrix here, 
    # or call them via workflow dispatch / reusable workflows.
    runs-on: ubuntu-latest
    steps:
      - name: Running Full CI Matrix Simulation
        run: echo "Running heavy builds and QEMU checks..."

  mark_gate_passed:
    needs: run_full_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Set Gatekeeper Status to Success
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Full CI Status',
              head_sha: '${{ needs.check_comment.outputs.head_sha }}',
              conclusion: 'success',
              output: {
                title: 'Full CI Completed',
                summary: 'All platform configurations and QEMU tests passed successfully via command trigger.'
              }
            });
