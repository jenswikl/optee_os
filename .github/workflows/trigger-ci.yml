name: Command Trigger Handler
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: write   # required for reRunWorkflow

jobs:
  handle_comment:
    name: Process /test all command
    # Only run on pull request comments where the body starts with /test all
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/test all')
    runs-on: ubuntu-latest
    steps:
      - name: Validate permissions and apply label
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;
            const { owner, repo } = context.repo;

            // Fetch PR details to check author
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: issueNumber });
            const prAuthor = pr.data.user.login;

            // Check if commenter is authorized (PR author or has write/admin access)
            const permRes = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: commenter
            });
            const permission = permRes.data.permission;
            const isAuthorized = commenter === prAuthor || ['admin', 'write'].includes(permission);

            if (!isAuthorized) {
              core.setFailed(`User ${commenter} is not authorized to trigger full CI.`);
              return;
            }

            // 1. Add the label to the PR (this satisfies your ci.yml conditions)
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issueNumber,
              labels: ['ci:run-all']
            });

            // 2. React to comment to acknowledge command
            await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: context.payload.comment.id,
              content: 'rocket'
            });

            // 3. Re-run the latest CI run for this PR's head commit. Match on head_sha
            //    (not branch name, which breaks for forks) and on the pull_request event
            //    (so we never re-run the nightly schedule run). ci.yml's "prepare" job
            //    reads the label live, so the re-run picks up the label added above.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: 'ci.yml',
              head_sha: pr.data.head.sha,
              event: 'pull_request',
              per_page: 1
            });

            if (runs.data.workflow_runs.length === 0) {
              core.warning('No CI run found for this commit; push a new commit to start CI.');
              return;
            }

            const run = runs.data.workflow_runs[0];
            if (run.status !== 'completed') {
              // A run still in progress can't be re-run. Its "prepare" job may already
              // have read the labels, so tell the user instead of failing silently.
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: 'A CI run is still in progress. Wait for it to finish, then comment `/test all` again.'
              });
              return;
            }

            await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
