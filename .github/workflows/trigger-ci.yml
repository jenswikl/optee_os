name: PR test commands

# Maintainer / PR-author commands, posted as a PR comment:
#   /test all  - label the PR ci:run-all and (re-)run the full CI
#   /test off  - remove the label; later pushes only run the cheap checks
on:
  issue_comment:
    types: [created]

permissions:
  actions: write        # re-run workflow runs
  issues: write         # labels, comments, reactions
  pull-requests: read

jobs:
  test_command:
    name: Handle /test command
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/test ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { comment, issue } = context.payload;
            const { owner, repo } = context.repo;
            const cmd = comment.body.trim().split(/\s+/)[1];
            if (!['all', 'off'].includes(cmd)) return;

            // Only the PR author or someone with write access may use this
            const user = comment.user.login;
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: user,
            });
            if (user !== issue.user.login && !['admin', 'write'].includes(perm.permission)) {
              core.setFailed(`${user} is not allowed to use /test ${cmd}.`);
              return;
            }

            const react = content => github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: comment.id, content,
            });
            const say = body => github.rest.issues.createComment({
              owner, repo, issue_number: issue.number, body,
            });

            if (cmd === 'off') {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: 'ci:run-all',
              }).catch(e => { if (e.status !== 404) throw e; });
              await react('+1');
              return;
            }

            // /test all
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: ['ci:run-all'],
            });
            await react('rocket');

            // A label added with GITHUB_TOKEN does not trigger the 'labeled' event,
            // so re-run the latest CI run for this commit by hand. ci.yml reads the
            // label live, so the re-run sees it.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: issue.number,
            });
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml',
              head_sha: pr.head.sha, event: 'pull_request', per_page: 1,
            });
            const run = data.workflow_runs[0];

            if (!run) {
              await say('No CI run found for this commit. Push a commit, then comment `/test all` again.');
            } else if (run.status !== 'completed') {
              await say('A CI run is still in progress. Once it finishes, comment `/test all` again.');
            } else {
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
            }
