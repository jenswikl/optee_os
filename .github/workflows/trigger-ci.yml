name: PR test commands

# Comment commands on a pull request (PR author or anyone with write access):
#   /test build | platforms | qemu | all   enable CI levels (several allowed)
#   /test off [level...]                   disable levels (default: all)
# Levels are PR labels (ci:build, ci:platforms, ci:qemu) read by ci.yml.
on:
  issue_comment:
    types: [created]
  pull_request_target:   # only used to post the welcome comment, never checks out PR code
    types: [opened]

permissions:
  actions: write        # cancel / re-run CI
  issues: write         # labels, comments, reactions
  pull-requests: read

jobs:
  welcome:
    name: Explain CI levels
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Thanks for the pull request! Code style (checkpatch) runs automatically.',
              'The rest of CI is opt-in to save resources. Comment when your PR is ready for it:',
              '',
              '| Comment | Runs |',
              '|---|---|',
              '| `/test build` | common build configurations |',
              '| `/test platforms` | vendor and other platform builds |',
              '| `/test qemu` | QEMU test suites (slow and expensive) |',
              '| `/test all` | everything above |',
              '| `/test off` | stop CI and disable all levels (`/test off qemu` for one level) |',
              '',
              'Enabled levels re-run on every push until switched off. A sensible order is to iterate',
              'with `/test build`, and to enable `qemu` (or `all`) once the series is ready for review.',
              'These commands work for the PR author and for maintainers.',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.payload.pull_request.number, body,
            });

  test_command:
    name: Handle /test command
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { comment, issue } = context.payload;
            const { owner, repo } = context.repo;
            const LEVELS = ['build', 'platforms', 'qemu'];

            const say = body => github.rest.issues.createComment({
              owner, repo, issue_number: issue.number, body,
            });
            const react = content => github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: comment.id, content,
            });

            // Parse "/test [off] level..." from the first line of the comment
            const words = comment.body.split('\n')[0].trim().toLowerCase().split(/\s+/);
            if (words[0] !== '/test') return;   // e.g. "/testing"
            const off = words[1] === 'off';
            let levels = words.slice(off ? 2 : 1);
            if (off && levels.length === 0) levels = ['all'];
            levels = [...new Set(levels.flatMap(l => l === 'all' ? LEVELS : [l]))];

            if (levels.length === 0 || levels.some(l => !LEVELS.includes(l))) {
              await say('Usage: `/test build|platforms|qemu|all` to enable levels, ' +
                        '`/test off [build|platforms|qemu]` to disable them.');
              return;
            }

            // Only the PR author or someone with write access may use this
            const user = comment.user.login;
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: user,
            });
            if (user !== issue.user.login && !['admin', 'write'].includes(perm.permission)) {
              await say(`@${user}: only the PR author and maintainers can use \`/test\`.`);
              return;
            }

            // Apply the labels
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: issue.number,
            });
            const has = new Set(labels.map(l => l.name));
            const wanted = levels.map(l => `ci:${l}`);
            if (off) {
              for (const name of wanted.filter(n => has.has(n))) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name });
              }
            } else {
              const add = wanted.filter(n => !has.has(n));
              if (add.length) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: add });
              }
            }
            await react(off ? '+1' : 'rocket');
            if (!off && levels.includes('qemu')) {
              await say('The QEMU suites are enabled for this PR and will re-run on every push. ' +
                        'Use `/test off qemu` to stop them while you iterate.');
            }

            // A label added with GITHUB_TOKEN does not trigger any workflow, so restart the
            // CI run of the current commit ourselves. ci.yml reads the labels live.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue.number });
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml',
              head_sha: pr.head.sha, event: 'pull_request', per_page: 1,
            });
            let run = data.workflow_runs[0];
            if (!run) {
              await say('There is no CI run for the latest commit yet; the change applies to the next run.');
              return;
            }
            try {
              if (run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                for (let i = 0; i < 24 && run.status !== 'completed'; i++) {
                  await new Promise(r => setTimeout(r, 5000));
                  run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id })).data;
                }
              }
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
            } catch (e) {
              await say('The levels are updated, but CI could not be restarted automatically ' +
                        `(${e.message}). Push a commit or re-run it from the Actions tab.`);
            }
